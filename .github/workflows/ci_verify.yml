name: Verify CI
run-name: "Verify ${{ github.event.pull_request && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.ref }}"

on:
  pull_request:
    branches: [main]
  push:
  workflow_call:

env:
  NODE_V: 26

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@${{ env.NODE_V }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm fmtcheck
      - run: echo 'Papilio palinurus'
